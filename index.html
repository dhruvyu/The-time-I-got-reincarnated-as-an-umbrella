<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>That Time I Got Reincarnated as an Umbrella!</title>
<meta name="description" content="An isekai manga. A man dies, wakes up as an umbrella in a Mauritian forest, and meets a boy named Krys.">
<meta name="theme-color" content="#080C12">
<meta property="og:title" content="That Time I Got Reincarnated as an Umbrella!">
<meta property="og:description" content="Rain or shine, power reigns. Read chapter 1.">
<meta property="og:image" content="pages/cover.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   1. TOKENS  — palette pulled from the cover: storm water,
   parasol blue, rain glint, gold title foil, aged poster paper
   ============================================================ */
:root{
  --ink:#080C12;
  --storm:#111C28;
  --slate:#1B2A3A;
  --parasol:#3E7CB1;
  --glint:#9FD8F2;
  --gild:#C8A64B;
  --paper:#EFE9DB;
  --paper-60:rgba(239,233,219,.60);
  --paper-38:rgba(239,233,219,.38);
  --hair:rgba(159,216,242,.16);

  --display:"Shippori Mincho B1",Georgia,serif;
  --body:"Zen Kaku Gothic New",system-ui,-apple-system,sans-serif;

  --gut:clamp(18px,5vw,56px);
  --bar:56px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--ink);
  color:var(--paper);
  font-family:var(--body);
  font-size:16px;
  line-height:1.65;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--glint);outline-offset:3px;border-radius:2px}
::selection{background:var(--parasol);color:#fff}

.eyebrow{
  font-size:11px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;
  color:var(--glint);opacity:.75;
}

/* ============================================================
   2. RAIN — the signature. It falls on the cover page.
   Open a chapter and it stops: you're under the umbrella.
   ============================================================ */
#rain{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  transition:opacity .9s ease;
}
body.sheltered #rain{opacity:0}

/* ============================================================
   3. HOME
   ============================================================ */
#home{position:relative;z-index:2}
body.reading #home{display:none}

.hero{
  position:relative;
  min-height:100svh;
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:var(--gut);
  padding-bottom:clamp(28px,7vw,72px);
  overflow:hidden;
}
.hero__art{
  position:absolute;inset:0;z-index:0;
  background:radial-gradient(120% 80% at 70% 10%,var(--slate),var(--ink) 70%);
}
.hero__art img{
  width:100%;height:100%;object-fit:cover;object-position:50% 22%;
  opacity:0;transition:opacity 1.2s ease;
  filter:saturate(.9) contrast(1.05);
}
.hero__art img.ready{opacity:.62}
.hero__art::after{
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(to top,var(--ink) 4%,rgba(8,12,18,.85) 34%,rgba(8,12,18,.15) 78%),
    linear-gradient(to right,rgba(8,12,18,.75),transparent 62%);
}
/* fallback mark, visible until the cover loads */
.mark{
  position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);
  width:min(46vw,300px);color:var(--parasol);opacity:.3;
}
.mark path,.mark line{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round}

.hero__body{position:relative;z-index:2;max-width:56ch}
.hero__jp{
  font-family:var(--display);font-weight:600;
  font-size:clamp(13px,3.4vw,18px);letter-spacing:.16em;
  color:var(--glint);opacity:.8;margin:0 0 .9rem;
}
.hero__title{
  font-family:var(--display);font-weight:800;
  font-size:clamp(38px,11.5vw,88px);
  line-height:.94;letter-spacing:-.015em;
  margin:0 0 .1em;
  text-wrap:balance;
}
.hero__title .em{
  color:var(--gild);
  display:block;
}
.hero__tag{
  font-size:clamp(13px,3.6vw,16px);
  color:var(--paper-60);margin:1.1rem 0 0;max-width:34ch;
}
.hero__meta{
  display:flex;flex-wrap:wrap;gap:.5rem 1.1rem;align-items:center;
  margin-top:1.6rem;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--paper-38);font-weight:500;
}
.hero__cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:1.8rem}

.btn{
  display:inline-flex;align-items:center;gap:.6em;
  padding:.92em 1.6em;border-radius:999px;
  font-weight:700;font-size:14px;letter-spacing:.06em;
  transition:transform .18s ease,background .18s ease,border-color .18s ease;
}
.btn--go{background:var(--gild);color:#12100A}
.btn--go:hover{transform:translateY(-2px);background:#DCBB63}
.btn--ghost{border:1px solid var(--hair);color:var(--paper)}
.btn--ghost:hover{border-color:var(--glint);transform:translateY(-2px)}

/* canopy divider — 8 ribs, same count as the umbrella he woke up as */
.canopy{display:block;width:100%;height:44px;color:var(--parasol);opacity:.35}
.canopy path{fill:none;stroke:currentColor;stroke-width:1.2}

/* chapters */
.chapters{padding:clamp(40px,9vw,90px) var(--gut) clamp(60px,12vw,120px);position:relative;z-index:2}
.chapters__head{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;margin-bottom:1.8rem}
.chapters__head h2{font-family:var(--display);font-weight:800;font-size:clamp(22px,6vw,34px);margin:0}
.chapters__list{display:grid;gap:12px;max-width:760px}

.ch{
  display:grid;grid-template-columns:74px 1fr auto;gap:16px;align-items:center;
  width:100%;text-align:left;
  padding:12px;border-radius:14px;
  background:linear-gradient(180deg,rgba(27,42,58,.7),rgba(17,28,40,.7));
  border:1px solid var(--hair);
  transition:border-color .2s ease,transform .2s ease;
}
.ch:hover{border-color:var(--parasol);transform:translateX(4px)}
.ch__thumb{
  width:74px;height:96px;border-radius:8px;overflow:hidden;flex:none;
  background:repeating-linear-gradient(115deg,var(--slate) 0 9px,var(--storm) 9px 18px);
  position:relative;
}
.ch__thumb img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s ease}
.ch__thumb img.ready{opacity:1}
.ch__n{font-family:var(--display);font-weight:800;font-size:12px;letter-spacing:.2em;color:var(--gild)}
.ch__t{font-family:var(--display);font-weight:600;font-size:clamp(16px,4.4vw,20px);margin:.15rem 0 .3rem;line-height:1.25}
.ch__c{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--paper-38)}
.ch__arrow{color:var(--glint);opacity:.6;font-size:20px;padding-right:6px}
.ch__bar{grid-column:1/-1;height:2px;border-radius:2px;background:rgba(159,216,242,.12);overflow:hidden}
.ch__bar i{display:block;height:100%;background:var(--gild);width:0;transition:width .5s ease}

.about{max-width:760px;margin-top:clamp(48px,10vw,80px);border-top:1px solid var(--hair);padding-top:2rem}
.about p{color:var(--paper-60);font-size:15px;max-width:60ch}
.about .creole{color:var(--glint);font-style:italic}
.foot{font-size:12px;color:var(--paper-38);letter-spacing:.1em;margin-top:2.5rem}

/* ============================================================
   4. READER
   ============================================================ */
#reader{
  position:fixed;inset:0;z-index:50;
  background:var(--ink);
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-y:contain;
  display:none;
}
body.reading #reader{display:block}

.topbar{
  position:fixed;top:0;left:0;right:0;height:var(--bar);z-index:60;
  display:flex;align-items:center;gap:8px;
  padding:0 12px;padding-top:env(safe-area-inset-top);
  background:linear-gradient(to bottom,rgba(8,12,18,.96),rgba(8,12,18,.72) 70%,transparent);
  transition:transform .28s ease,opacity .28s ease;
}
.topbar.hide{transform:translateY(-110%);opacity:0}
.topbar__t{
  font-family:var(--display);font-weight:600;font-size:14px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;
}
.icobtn{
  width:40px;height:40px;border-radius:10px;flex:none;
  display:grid;place-items:center;
  border:1px solid var(--hair);
  transition:border-color .2s ease,background .2s ease;
}
.icobtn:hover{border-color:var(--glint);background:rgba(159,216,242,.08)}
.icobtn svg{width:19px;height:19px;fill:none;stroke:var(--paper);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.icobtn small{font-size:10px;font-weight:700;letter-spacing:.06em}

.strip{
  position:fixed;top:0;left:0;right:0;height:2px;z-index:61;
  background:rgba(159,216,242,.12);
}
.strip i{display:block;height:100%;width:0;background:var(--gild);transition:width .15s linear}

.pages{padding:calc(var(--bar) + 8px) 0 0}
.page{
  position:relative;
  margin:0 auto 10px;
  max-width:900px;
  background:var(--storm);
}
.page img{width:100%;height:auto;opacity:0;transition:opacity .45s ease}
.page img.ready{opacity:1}
.page__n{
  position:absolute;top:8px;left:8px;z-index:2;
  font-size:10px;letter-spacing:.18em;font-weight:700;
  padding:3px 8px;border-radius:99px;
  background:rgba(8,12,18,.6);color:var(--paper-38);
  opacity:0;transition:opacity .3s ease;
}
.page:hover .page__n{opacity:1}
.page__hold{
  aspect-ratio:3/4;display:grid;place-content:center;gap:8px;text-align:center;
  padding:24px;border:1px dashed var(--hair);color:var(--paper-38);font-size:13px;
}
.page__hold code{color:var(--glint);font-size:12px;word-break:break-all}

/* fit-to-screen mode */
#reader[data-fit="page"] .pages{padding-top:0;scroll-snap-type:y mandatory}
#reader[data-fit="page"] .page{
  height:100svh;display:grid;place-items:center;
  scroll-snap-align:center;margin-bottom:0;background:var(--ink);
}
#reader[data-fit="page"] .page img{width:auto;max-width:100%;max-height:100svh}

.endcard{
  max-width:560px;margin:0 auto;padding:clamp(40px,10vw,80px) var(--gut) 90px;text-align:center;
}
.endcard h3{font-family:var(--display);font-weight:800;font-size:clamp(22px,6vw,30px);margin:.6rem 0 .3rem}
.endcard p{color:var(--paper-60);font-size:14px;margin:0 0 1.8rem}
.endcard .btn{margin:0 5px}

.botbar{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(14px + env(safe-area-inset-bottom));z-index:60;
  padding:8px 16px;border-radius:999px;
  background:rgba(8,12,18,.82);backdrop-filter:blur(10px);
  border:1px solid var(--hair);
  font-size:12px;letter-spacing:.16em;font-weight:700;color:var(--paper-60);
  transition:opacity .28s ease;
}
.botbar b{color:var(--gild);font-weight:700}
.botbar.hide{opacity:0}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  #rain{display:none}
}
@media (max-width:520px){
  .ch{grid-template-columns:60px 1fr auto;gap:12px}
  .ch__thumb{width:60px;height:80px}
}
</style>
</head>
<body>

<canvas id="rain" aria-hidden="true"></canvas>

<!-- ========================= HOME ========================= -->
<main id="home">
  <header class="hero">
    <div class="hero__art">
      <svg class="mark" viewBox="0 0 180 180" aria-hidden="true">
        <path d="M8 62 C8 26 44 8 90 8 C136 8 172 26 172 62"/>
        <path d="M8 62 Q28 80 49 62 Q69 80 90 62 Q110 80 131 62 Q151 80 172 62"/>
        <line x1="90" y1="8" x2="8" y2="62"/><line x1="90" y1="8" x2="49" y2="62"/>
        <line x1="90" y1="8" x2="131" y2="62"/><line x1="90" y1="8" x2="172" y2="62"/>
        <line x1="90" y1="0" x2="90" y2="8"/>
        <path d="M90 62 V150 Q90 172 70 172 Q52 172 52 156"/>
      </svg>
      <img id="coverArt" alt="">
    </div>

    <div class="hero__body">
      <p class="hero__jp" id="jpTitle"></p>
      <h1 class="hero__title" id="mainTitle"></h1>
      <p class="hero__tag" id="tagline"></p>
      <div class="hero__meta" id="heroMeta"></div>
      <div class="hero__cta">
        <button class="btn btn--go" id="startBtn">Start reading</button>
        <button class="btn btn--ghost" id="contBtn" hidden>Continue</button>
      </div>
    </div>
  </header>

  <svg class="canopy" viewBox="0 0 800 44" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 22 Q50 44 100 22 Q150 44 200 22 Q250 44 300 22 Q350 44 400 22 Q450 44 500 22 Q550 44 600 22 Q650 44 700 22 Q750 44 800 22"/>
  </svg>

  <section class="chapters">
    <div class="chapters__head">
      <h2>Chapters</h2>
      <span class="eyebrow" id="chCount"></span>
    </div>
    <div class="chapters__list" id="chList"></div>

    <div class="about">
      <p class="eyebrow">About</p>
      <p id="synopsis"></p>
      <p class="creole">Sa ene zoli parapli sa.</p>
      <p class="foot" id="credit"></p>
    </div>
  </section>
</main>

<!-- ======================== READER ======================== -->
<div id="reader" data-fit="width" role="region" aria-label="Manga reader">
  <div class="strip"><i id="stripFill"></i></div>
  <div class="topbar" id="topbar">
    <button class="icobtn" id="backBtn" aria-label="Back to chapters">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <span class="topbar__t" id="readTitle"></span>
    <button class="icobtn" id="fitBtn" aria-label="Switch to fit-page view"><small id="fitLabel">FIT</small></button>
  </div>
  <div class="pages" id="pages"></div>
</div>
<div class="botbar hide" id="botbar" aria-live="polite"></div>

<noscript style="display:block;padding:2rem">This reader needs JavaScript switched on.</noscript>

<script>
/* ══════════════════════════════════════════════════════════════
   ▓▓  ADD YOUR PAGES HERE  ▓▓   — this block is the only part
   you ever need to touch.

   Folder layout expected next to this index.html file:

     index.html
     pages/
       cover.jpg
       ch01/  01.jpg  02.jpg  03.jpg  04.jpg  05.jpg  06.jpg
       ch02/  01.jpg  02.jpg  ...

   TO ADD A PAGE   → drop 07.jpg into pages/ch01/ and change
                     count: 6  →  count: 7
   TO ADD A CHAPTER→ make pages/ch02/, then copy a chapter block
                     below and change folder / title / count.

   Filenames must be zero-padded to 2 digits (01, 02 ... 10, 11).
   If yours aren't, use  files:["pages/ch01/whatever.jpg", ...]
   instead of folder/count.
   ══════════════════════════════════════════════════════════════ */
const MANGA = {
  title:    "That Time I Got Reincarnated as an Umbrella!",
  titleEm:  "Umbrella!",                 // part of the title printed in gold
  titleJp:  "あの日、私は傘に転生してしまった！",
  tagline:  "A new isekai saga: rain or shine, power reigns!",
  author:   "Dhruvyy",
  studio:   "Overpowered Parasol Studio",
  cover:  "Pages/cover.jpg",
  synopsis: "Bapamah dies the moment his dream finally comes true. He wakes with no eyes, no mouth and no way to move, under a sky full of stars somewhere in a Mauritian forest — and a boy named Krys picks him up.",

  chapters: [
    {
      title:  "Reborn as an Umbrella",
      folder: "Pages/Ch01/",
      count:  6,
      ext:    "jpg"
    }
    /* ,{
      title:  "Chapter two title",
      folder: "pages/ch02/",
      count:  0,
      ext:    "jpg"
    } */
  ]
};
/* ══════════════════ end of the part you edit ══════════════════ */


/* ---------- storage that never throws ---------- */
const store = (()=>{
  let ok = true; try{ localStorage.setItem('_t','1'); localStorage.removeItem('_t'); }catch(e){ ok=false; }
  const mem = {};
  return {
    get:k=>{ try{ return ok ? localStorage.getItem(k) : mem[k]; }catch(e){ return mem[k]; } },
    set:(k,v)=>{ try{ ok ? localStorage.setItem(k,v) : (mem[k]=v); }catch(e){ mem[k]=v; } }
  };
})();

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const pageCount = ch => ch.files ? ch.files.length : (ch.count||0);
const pageSrc = (ch,i) => ch.files ? ch.files[i] : ch.folder + pad(i+1) + '.' + (ch.ext||'jpg');
const totalPages = MANGA.chapters.reduce((a,c)=>a+pageCount(c),0);

/* ---------- fill the home page ---------- */
$('#jpTitle').textContent = MANGA.titleJp;
document.title = MANGA.title;
(function(){
  const t = MANGA.title, em = MANGA.titleEm;
  const i = em ? t.lastIndexOf(em) : -1;
  $('#mainTitle').innerHTML = i > -1
    ? t.slice(0,i) + '<span class="em">' + t.slice(i) + '</span>'
    : t;
})();
$('#tagline').textContent = MANGA.tagline;
$('#synopsis').textContent = MANGA.synopsis;
$('#credit').textContent = '© ' + new Date().getFullYear() + ' ' + MANGA.author + ' · ' + MANGA.studio;
$('#heroMeta').innerHTML =
  '<span>' + MANGA.chapters.length + ' chapter' + (MANGA.chapters.length>1?'s':'') + '</span>' +
  '<span>' + totalPages + ' pages</span>' +
  '<span>Ongoing</span>';
$('#chCount').textContent = MANGA.chapters.length + ' available';

const cover = $('#coverArt');
cover.onload = ()=>cover.classList.add('ready');
cover.src = MANGA.cover;

/* ---------- chapter list ---------- */
const chList = $('#chList');
MANGA.chapters.forEach((ch,ci)=>{
  const n = pageCount(ch);
  const b = document.createElement('button');
  b.className = 'ch';
  b.innerHTML =
    '<span class="ch__thumb"><img alt="" loading="lazy"></span>' +
    '<span><span class="ch__n">CHAPTER ' + pad(ci+1) + '</span>' +
      '<span class="ch__t">' + ch.title + '</span>' +
      '<span class="ch__c">' + (n ? n + ' pages' : 'coming soon') + '</span></span>' +
    '<span class="ch__arrow" aria-hidden="true">→</span>' +
    '<span class="ch__bar"><i></i></span>';
  const img = b.querySelector('img');
  if(n){ img.onload = ()=>img.classList.add('ready'); img.src = pageSrc(ch,0); }
  const seen = +(store.get('read:'+ci) || 0);
  if(n) b.querySelector('.ch__bar i').style.width = Math.min(100, seen/n*100) + '%';
  b.onclick = ()=> n ? openChapter(ci) : null;
  b.disabled = !n;
  chList.appendChild(b);
});

/* ---------- reader ---------- */
const reader = $('#reader'), pagesEl = $('#pages'), botbar = $('#botbar');
const topbar = $('#topbar'), stripFill = $('#stripFill');
let current = -1, curPage = 1, io = null;

function openChapter(ci, startAt){
  const ch = MANGA.chapters[ci];
  current = ci;
  $('#readTitle').textContent = 'Ch. ' + pad(ci+1) + ' · ' + ch.title;
  pagesEl.innerHTML = '';
  const n = pageCount(ch);

  for(let i=0;i<n;i++){
    const d = document.createElement('div');
    d.className = 'page';
    d.dataset.n = i+1;
    d.innerHTML = '<span class="page__n">' + pad(i+1) + '</span>';
    const img = new Image();
    img.alt = 'Page ' + (i+1);
    img.loading = i < 2 ? 'eager' : 'lazy';
    img.decoding = 'async';
    img.onload = ()=>img.classList.add('ready');
    img.onerror = ()=>{
      const hold = document.createElement('div');
      hold.className = 'page__hold';
      hold.innerHTML = 'Page ' + (i+1) + ' isn\'t there yet.<br>Add this file:<code>' + pageSrc(ch,i) + '</code>';
      img.replaceWith(hold);
    };
    img.src = pageSrc(ch,i);
    d.appendChild(img);
    pagesEl.appendChild(d);
  }

  const end = document.createElement('div');
  end.className = 'endcard';
  const next = MANGA.chapters[ci+1];
  end.innerHTML =
    '<p class="eyebrow">End of chapter ' + pad(ci+1) + '</p>' +
    '<h3>' + (next && pageCount(next) ? next.title : 'To be continued') + '</h3>' +
    '<p>' + (next && pageCount(next) ? 'Chapter ' + pad(ci+2) + ' is ready.' : 'New pages land here as they\'re drawn.') + '</p>' +
    (next && pageCount(next) ? '<button class="btn btn--go" id="nextCh">Next chapter</button>' : '') +
    '<button class="btn btn--ghost" id="homeBtn2">Back to chapters</button>';
  pagesEl.appendChild(end);
  const nb = end.querySelector('#nextCh'); if(nb) nb.onclick = ()=>openChapter(ci+1);
  end.querySelector('#homeBtn2').onclick = closeReader;

  document.body.classList.add('reading','sheltered');
  botbar.classList.remove('hide');
  reader.scrollTop = 0;
  observe();

  if(startAt && startAt > 1){
    const t = pagesEl.querySelector('.page[data-n="'+startAt+'"]');
    if(t) requestAnimationFrame(()=>reader.scrollTop = t.offsetTop - 60);
  }
  history.replaceState(null,'','#ch' + (ci+1));
  setCounter(startAt||1, n);
}

function closeReader(){
  document.body.classList.remove('reading','sheltered');
  botbar.classList.add('hide');
  if(io) io.disconnect();
  history.replaceState(null,'',location.pathname);
  refreshBars();
}

function setCounter(p,n){
  curPage = p;
  botbar.innerHTML = '<b>' + pad(p) + '</b> / ' + pad(n);
  stripFill.style.width = (p/n*100) + '%';
  store.set('last', current + ':' + p);
  const seen = +(store.get('read:'+current) || 0);
  if(p > seen) store.set('read:'+current, p);
}

function observe(){
  if(io) io.disconnect();
  const n = pageCount(MANGA.chapters[current]);
  io = new IntersectionObserver(es=>{
    es.forEach(e=>{ if(e.isIntersecting) setCounter(+e.target.dataset.n, n); });
  },{root:reader, rootMargin:'-45% 0px -45% 0px'});
  pagesEl.querySelectorAll('.page').forEach(p=>io.observe(p));
}

function refreshBars(){
  chList.querySelectorAll('.ch').forEach((b,ci)=>{
    const n = pageCount(MANGA.chapters[ci]); if(!n) return;
    const seen = +(store.get('read:'+ci) || 0);
    b.querySelector('.ch__bar i').style.width = Math.min(100, seen/n*100) + '%';
  });
  showContinue();
}

/* auto-hide the top bar while scrolling down */
let lastY = 0;
reader.addEventListener('scroll',()=>{
  const y = reader.scrollTop;
  if(y > 90 && y > lastY){ topbar.classList.add('hide'); botbar.classList.add('hide'); }
  else { topbar.classList.remove('hide'); botbar.classList.remove('hide'); }
  lastY = y;
},{passive:true});

/* controls */
$('#backBtn').onclick = closeReader;
$('#fitBtn').onclick = ()=>{
  const page = reader.dataset.fit === 'page';
  reader.dataset.fit = page ? 'width' : 'page';
  $('#fitLabel').textContent = page ? 'FIT' : 'WIDE';
  $('#fitBtn').setAttribute('aria-label', page ? 'Switch to fit-page view' : 'Switch to full-width view');
  store.set('fit', reader.dataset.fit);
  const t = pagesEl.querySelector('.page[data-n="'+curPage+'"]');
  if(t) requestAnimationFrame(()=>t.scrollIntoView({block:'center'}));
};
if(store.get('fit') === 'page'){ reader.dataset.fit = 'page'; $('#fitLabel').textContent = 'WIDE'; }

$('#startBtn').onclick = ()=>openChapter(0);
function showContinue(){
  const last = (store.get('last')||'').split(':');
  const ci = +last[0], p = +last[1];
  const btn = $('#contBtn');
  if(MANGA.chapters[ci] && p > 1){
    btn.hidden = false;
    btn.textContent = 'Continue — ch. ' + pad(ci+1) + ', p. ' + pad(p);
    btn.onclick = ()=>openChapter(ci,p);
  } else btn.hidden = true;
}
showContinue();

document.addEventListener('keydown',e=>{
  if(!document.body.classList.contains('reading')) return;
  if(e.key === 'Escape') return closeReader();
  const dir = (e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' ') ? 1
            : (e.key==='ArrowLeft'||e.key==='ArrowUp') ? -1 : 0;
  if(!dir) return;
  e.preventDefault();
  const t = pagesEl.querySelector('.page[data-n="'+(curPage+dir)+'"]');
  if(t) t.scrollIntoView({behavior:'smooth',block:'start'});
});

/* deep link: index.html#ch1 */
(function(){
  const m = /^#ch(\d+)$/.exec(location.hash);
  if(m && MANGA.chapters[m[1]-1]) openChapter(+m[1]-1);
})();

/* ---------- rain ---------- */
(function(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = $('#rain'), x = c.getContext('2d');
  let w,h,drops=[],raf;
  const resize = ()=>{
    const d = Math.min(devicePixelRatio||1, 2);
    w = c.width = innerWidth*d; h = c.height = innerHeight*d;
    c.style.width = innerWidth+'px'; c.style.height = innerHeight+'px';
    x.scale(d,d);
    const count = innerWidth < 640 ? 70 : 130;
    drops = Array.from({length:count},()=>({
      x:Math.random()*innerWidth, y:Math.random()*innerHeight,
      l:6+Math.random()*16, v:3+Math.random()*5, o:.1+Math.random()*.35
    }));
  };
  const tick = ()=>{
    x.clearRect(0,0,innerWidth,innerHeight);
    x.lineWidth = 1; x.lineCap='round';
    for(const d of drops){
      x.strokeStyle = 'rgba(159,216,242,'+d.o+')';
      x.beginPath(); x.moveTo(d.x,d.y); x.lineTo(d.x-1.4,d.y+d.l); x.stroke();
      d.y += d.v; d.x -= .4;
      if(d.y > innerHeight){ d.y = -d.l; d.x = Math.random()*innerWidth; }
    }
    raf = requestAnimationFrame(tick);
  };
  addEventListener('resize',resize,{passive:true});
  document.addEventListener('visibilitychange',()=>{
    cancelAnimationFrame(raf);
    if(!document.hidden && !document.body.classList.contains('reading')) tick();
  });
  resize(); tick();
})();
</script>
</body>
