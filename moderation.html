<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Reader feedback moderation</title><style>
:root{font-family:system-ui,sans-serif;color-scheme:dark;background:#101725;color:#f1f5fb}body{max-width:820px;margin:auto;padding:20px}h1{font-size:1.65rem}input,button{font:inherit;padding:12px;border-radius:9px}input{background:#1b2940;color:white;border:1px solid #53627c;max-width:100%;box-sizing:border-box}button{border:0;background:#5276d8;color:white;cursor:pointer;margin:5px 5px 5px 0}button:disabled{opacity:.5}button.danger{background:#ae394a}button.muted{background:#44526c}article{background:#1a263a;border:1px solid #39475e;padding:16px;border-radius:12px;margin:14px 0;overflow-wrap:anywhere}small{color:#b5c2d7}p{white-space:pre-wrap}#message{min-height:1.5em}label{display:block;margin-bottom:10px}a{color:#9ec2ff}</style></head>
<body><h1>Reader feedback moderation</h1><p>Private admin access. Keep your admin token secret. It stays in this tab only and is never saved to browser storage.</p>
<label>Cloudflare ADMIN_TOKEN<br><input id="token" type="password" autocomplete="off" placeholder="Paste your admin token"></label><button id="load">Load reports</button><button id="clear" class="muted">Clear token</button><p id="message" role="status" aria-live="polite"></p>
<h2>Reported comments</h2><div id="reports"></div><h2>Hidden or pending comments</h2><div id="hidden"></div>
<script>
const api='https://umbrella-feedback.dhruvgooljar.workers.dev',token=document.querySelector('#token'),message=document.querySelector('#message'),reports=document.querySelector('#reports'),hidden=document.querySelector('#hidden');
async function request(path,body){const res=await fetch(api+path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token.value.trim(),...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});const data=await res.json();if(!res.ok)throw Error(data.error||'Request failed');return data}
function element(tag,text){const el=document.createElement(tag);el.textContent=text;return el}
function action(container,label,body,cls){const btn=element('button',label);if(cls)btn.className=cls;btn.onclick=async()=>{if(cls==='danger'&&!confirm('Hide this comment from public view?'))return;btn.disabled=true;try{await request(body.path,body.data);message.textContent='Action completed.';await load()}catch(e){message.textContent=e.message}finally{btn.disabled=false}};container.append(btn)}
async function load(){if(!token.value.trim()){message.textContent='Enter your admin token.';return}message.textContent='Loading…';try{const [r,c]=await Promise.all([request('/admin/reports'),request('/admin/comments')]);reports.replaceChildren();hidden.replaceChildren();if(!r.reports.length)reports.append(element('p','No active reports.'));for(const x of r.reports){const card=element('article','');card.append(element('small','Chapter '+x.chapter+' · '+x.nickname+' · '+x.reason+' · '+x.created_at+' · '+x.status),element('p',x.body));action(card,'Dismiss report',{path:'/admin/reports',data:{reportId:x.id,action:'dismiss'}},'muted');if(x.status==='approved')action(card,'Hide comment',{path:'/admin/reports',data:{reportId:x.id,action:'hide'}},'danger');reports.append(card)}if(!c.comments.length)hidden.append(element('p','No hidden or pending comments.'));for(const x of c.comments){const card=element('article','');card.append(element('small','Chapter '+x.chapter+' · '+x.nickname+' · '+x.status),element('p',x.body));action(card,'Approve / restore',{path:'/admin/comments',data:{id:x.id,status:'approved'}});if(x.status!=='rejected')action(card,'Hide',{path:'/admin/comments',data:{id:x.id,status:'rejected'}},'danger');hidden.append(card)}message.textContent='Loaded '+r.reports.length+' reports and '+c.comments.length+' hidden/pending comments.'}catch(e){message.textContent=e.message;reports.replaceChildren();hidden.replaceChildren()}}
document.querySelector('#load').onclick=load;document.querySelector('#clear').onclick=()=>{token.value='';reports.replaceChildren();hidden.replaceChildren();message.textContent='Token cleared.'};
</script></body></html>
